version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - DJANGO_SECRET_KEY=your-secret-key-change-in-production
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - GUNICORN_WORKERS=2
      - GUNICORN_THREADS=4
      # Enable dynamic nginx config API
      - ENABLE_CONFIG_API=true
      - NGINX_CONFIG_API_PORT=8081
    volumes:
      # Persist media files
      - media_data:/app/media
      # Persist SQLite database (for development)
      - db_data:/app/db
      # Persist nginx route configurations
      - nginx_routes:/var/lib/nginx-api
      # Persist nginx config backups
      - nginx_backups:/var/backups/nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app_network

  # Example backend service for testing dynamic routing
  # Uncomment to test dynamic backend configuration
  # backend1:
  #   image: nginx:alpine
  #   command: |
  #     sh -c 'echo "server { listen 80; location / { return 200 \"Backend 1\"; add_header Content-Type text/plain; } }" > /etc/nginx/conf.d/default.conf && nginx -g "daemon off;"'
  #   networks:
  #     - app_network

  # backend2:
  #   image: nginx:alpine
  #   command: |
  #     sh -c 'echo "server { listen 80; location / { return 200 \"Backend 2\"; add_header Content-Type text/plain; } }" > /etc/nginx/conf.d/default.conf && nginx -g "daemon off;"'
  #   networks:
  #     - app_network

volumes:
  media_data:
  db_data:
  nginx_routes:
  nginx_backups:

networks:
  app_network:
    driver: bridge
