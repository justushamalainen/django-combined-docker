# Nginx configuration for Django with Gunicorn
# Runs in single worker mode for container deployment
# Supports dynamic backend configuration via API

# Run as non-daemon for container compatibility
daemon off;

# Single worker process (as requested)
worker_processes 1;

# Error log to stderr for container logging
error_log /dev/stderr warn;

# PID file location
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging to stdout/stderr for container logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstream for Gunicorn (Django app)
    upstream django {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # Upstream for Config API
    upstream config_api {
        server 127.0.0.1:8081;
        keepalive 8;
    }

    # Main server block - Django app, static/media, and config API
    server {
        listen 80;
        server_name _;

        # Max upload size
        client_max_body_size 100M;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Health check endpoint (responds directly from nginx)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Config API endpoints (for managing dynamic backends)
        location /api/nginx/ {
            # Rewrite to remove the /api/nginx prefix
            rewrite ^/api/nginx/(.*) /$1 break;
            rewrite ^/api/nginx$ / break;

            proxy_pass http://config_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Static files - served directly by Nginx
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";

            # Try the file, then return 404
            try_files $uri =404;
        }

        # Media files - served directly by Nginx
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";

            # Try the file, then return 404
            try_files $uri =404;
        }

        # Favicon handling
        location = /favicon.ico {
            alias /app/staticfiles/images/favicon.ico;
            access_log off;
            log_not_found off;
            expires 30d;
        }

        # Proxy to dynamic backends (port 8090)
        # Use this for routes that need dynamic backend routing
        location /proxy/ {
            # Rewrite to remove /proxy prefix before forwarding
            rewrite ^/proxy/(.*) /$1 break;

            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Proxy all other requests to Gunicorn (Django)
        location / {
            proxy_pass http://django;
            proxy_http_version 1.1;

            # Headers for proper proxying
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }
    }

    # Include dynamic backend configurations
    # This file is managed by the nginx-config-api
    include /etc/nginx/conf.d/*.conf;
}
